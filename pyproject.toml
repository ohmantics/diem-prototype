[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "diem"
version = "0.1.0"
description = "Illustrative prototype for the DIEM architecture draft: digital emblems in the DNS"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Veridigo LLC", email = "alexr@veridigo.com" }]
dependencies = [
    "cbor2==6.3.0",
    "cryptography==50.0.2",
    "dnspython==2.9.2",
    "pyhpke==0.6.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["diem*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
