[keys.courier]
name = 1
letter = 2

[keys.details]
title = 1
records = 2
steward = 3

[keys.position]
latitude = 1
longitude = 2
as-of = 3

# Enumerated values are integers in the encoding.

[enums.profile-id]
ihl-protective = 1
mark = 2
product-class = 3
product-item = 4
ispm15 = 5
consignment = 6
diplomatic-pouch = 7
peacekeeping-personnel = 8
peacekeeping-mission = 9
recipient-key = 10
endorsement = 11
peacekeeping-convoy = 12
dg-package = 13
cites-permit = 14
storage-device = 15
dataset = 16

[enums.modality]
prohibit = 1
request = 2
require = 3

[enums.action]
attack = 1
open = 2
detain = 3
inspect = 4
read = 5
report = 6
"verify-identity" = 7

[enums.citation-scheme]
uri = 1
eli = 2
akn = 3

[enums.purpose-id]
protective-red-cross = 1
protective-red-crescent = 2
protective-red-crystal = 3

[enums.chemistry]
li-ion = 1
li-polymer = 2
nimh = 3
alkaline = 4

[enums.valuation-basis]
transaction-value = 1
identical-goods = 2
similar-goods = 3
deductive = 4
computed = 5
fallback = 6

[enums.personnel-status]
peacekeeper = 1
civilian-staff = 2
military-observer = 3

# Which enumeration the values under a map key come from.
[values-of]
profile = "profile-id"
endorsed-profile = "profile-id"
purpose = "purpose-id"
scope = "purpose-id"
scheme = "citation-scheme"
battery-chemistry = "chemistry"
method = "valuation-basis"
status = "personnel-status"

# Which key space the maps under a map key use.
[maps-of]
endorsements = "endorsement-entry"
basis = "citation"
transport = "transport"
contents = "content"
dangerous-goods = "dangerous-goods"
radio-auth = "radio-auth"
lines = "line"
seller = "party"
buyer = "party"
importer-of-record = "party"
ship-to = "party"
consolidator = "party"

# Maps whose keys are enumerated modalities and whose values are actions.
[enum-maps]
treatment = ["modality", "action"]
if-invalid = ["modality", "action"]
scope = ["modality", "action"]
