# The integer each name encodes to in the strawman encoding.   # draft: #strawman
#
# The numbers are illustrative. The common keys are positive (1 to 23 take
# one octet), each profile's own keys are negative (-1 to -24 take one octet),
# and a map nested inside an emblem has a small key space of its own.
# Everything else in the repository, including the CDDL, uses the names.

[keys.common]
profile = 1
asset = 2
valid = 3
issuer-name = 4
treatment = 5
basis = 6
crit = 7
origin = 8
mark = 9
gross-mass = 10
seal = 11
endorsements = 12
class-ref = 13

[keys.ihl-protective]
purpose = -1

[keys.mark]
media-type = -1
image = -2

[keys.endorsement]
issuer = -1
endorsed-profile = -2
scope = -3
dnskey-digest = -4
mark-digest = -5

[keys.product-class]
gtin = -1
model = -2
dangerous-goods = -3
battery-chemistry = -4
battery-energy = -5
recycling = -6
mid-us = -7
radio-auth = -8

[keys.product-item]
serial = -1
made = -2

[keys.ispm15]
country = -1
producer = -2
measure = -3

[keys.consignment]
hs-code = -1
hts-us = -2
container = -3
packages = -4
transport = -5
valuation = -6
parties = -7
contents = -8
valuation-digest = -9

[keys.diplomatic-pouch]
sending-state = -1
consignee = -2
pieces = -3
courier = -4

[keys.peacekeeping-personnel]
mission = -1
status = -2

[keys.peacekeeping-mission]
contact = -1
if-invalid = -2

[keys.peacekeeping-convoy]
mission = -1
position = -2

[keys.dg-package]
un-number = -1
dg-class = -2
valuation = -3

[keys.cites-permit]
permit-number = -1
appendix = -2
species-code = -3

[keys.storage-device]
serial = -1
dataset = -2

[keys.dataset]
details = -1

[keys.recipient-key]
key-id = -1
cose-alg = -2
public-key = -3

# Maps nested in an emblem.

[keys.endorsement-entry]
